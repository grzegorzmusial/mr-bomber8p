name: Build Windows package

on:
  workflow_dispatch:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build-uwp:
    runs-on: windows-2022
    env:
      UWP_PFX_BASE64: ${{ secrets.UWP_PFX_BASE64 }}
      UWP_PFX_PASSWORD: ${{ secrets.UWP_PFX_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x

      - name: Prepare signing certificate
        shell: pwsh
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          if ($env:UWP_PFX_BASE64) {
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:UWP_PFX_BASE64))
          } else {
            [xml]$manifest = Get-Content UWP/MrBoom/Package.appxmanifest
            $cert = New-SelfSignedCertificate -Type Custom -Subject $manifest.Package.Identity.Publisher -KeyUsage DigitalSignature -FriendlyName 'Mr Bomber development signing' -CertStoreLocation Cert:\CurrentUser\My -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3', '2.5.29.19={text}')
            $env:UWP_PFX_PASSWORD = [Guid]::NewGuid().ToString('N')
            $password = ConvertTo-SecureString $env:UWP_PFX_PASSWORD -AsPlainText -Force
            Export-PfxCertificate -Cert $cert -FilePath $pfxPath -Password $password | Out-Null
            Write-Output "::add-mask::$env:UWP_PFX_PASSWORD"
            "UWP_PFX_PASSWORD=$env:UWP_PFX_PASSWORD" >> $env:GITHUB_ENV
          }
          "PFX_PATH=$pfxPath" >> $env:GITHUB_ENV

      - name: Restore, build and package x64
        shell: pwsh
        run: |
          $packageDir = Join-Path $env:GITHUB_WORKSPACE 'AppPackages'
          msbuild UWP/MrBoom.sln /restore /m /p:Configuration=Release /p:Platform=x64 /p:GenerateAppxPackageOnBuild=true /p:AppxBundle=Always /p:AppxBundlePlatforms=x64 /p:UapAppxPackageBuildMode=SideloadOnly /p:AppxPackageSigningEnabled=true "/p:PackageCertificateKeyFile=$env:PFX_PATH" "/p:PackageCertificatePassword=$env:UWP_PFX_PASSWORD" "/p:AppxPackageDir=$packageDir\" /p:AppxSymbolPackageEnabled=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Get-ChildItem $packageDir -Recurse -Filter *.appxbundle)) { throw 'No appxbundle was generated.' }
          Copy-Item WINDOWS-RELEASE.md $packageDir/INSTALL.md
          Compress-Archive -Path "$packageDir/*" -DestinationPath Mr-Bomber-Windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Mr-Bomber-Windows-x64
          path: Mr-Bomber-Windows-x64.zip
          if-no-files-found: error

  release:
    if: github.event_name != 'pull_request'
    needs: build-uwp
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Mr-Bomber-Windows-x64
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

        run: |
          TAG=$(python -c 'import xml.etree.ElementTree as E; print("v" + E.parse("UWP/MrBoom/Package.appxmanifest").getroot().find("{http://schemas.microsoft.com/appx/manifest/foundation/windows10}Identity").attrib["Version"].removesuffix(".0"))')
          gh release create "$TAG" Mr-Bomber-Windows-x64.zip --target "$GITHUB_SHA" --generate-notes --title "Mr. Bomber $TAG"
